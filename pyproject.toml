[project]
name = "salaires-so2026"
version = "0.1.0"
description = "Application Streamlit d'analyse des salaires des développeurs en France, enquête Stack Overflow 2026"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "nbstripout>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salaires"]
